name: Deploy schedule app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/minjok-schedule..."
      - name: Build
        # Project pages are served from /<repo-name>/, so the base path must match.
        run: |
          pnpm --filter @workspace/minjok-schedule run build
        env:
          PORT: "3000"
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Add SPA fallback
        run: cp artifacts/minjok-schedule/dist/public/index.html artifacts/minjok-schedule/dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/minjok-schedule/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
